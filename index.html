<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulador de Prova - Autoescola Regional</title>
<style>
:root{--b:#0b2f9f;--r:#e51b23;--g:#15803d;--x:#b91c1c;--bg:#f5f7fb;--tx:#1f2937}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:linear-gradient(135deg,#071d69,#173fbe);color:#fff;padding:14px}
.h{max-width:920px;margin:auto;display:flex;gap:14px;align-items:center}.logo{background:#fff;border-radius:12px;padding:8px;width:150px;flex:0 0 auto}.logo img{display:block;width:100%;height:auto;object-fit:contain}
h1{margin:0 0 5px;font-size:clamp(1.25rem,3vw,2rem)}header p{margin:0;opacity:.9}
main{max-width:900px;margin:24px auto;padding:0 12px}.card{background:#fff;border-radius:16px;padding:clamp(18px,4vw,30px);box-shadow:0 8px 28px #14234617}
.top{display:flex;justify-content:space-between;gap:10px;color:#6b7280;font-weight:700}.bar{height:10px;background:#e8edf5;border-radius:99px;overflow:hidden;margin:12px 0 24px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--r))}
.q{font-size:clamp(1.1rem,2.8vw,1.4rem);font-weight:800;line-height:1.4}.opts{display:grid;gap:10px}.opt{border:2px solid #dfe5ef;background:#fff;border-radius:12px;padding:14px;text-align:left;cursor:pointer;font-size:1rem}.opt.sel{border-color:var(--b);background:#eef3ff}
.ctrl{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}.pri{background:var(--b);color:#fff}.sec{background:#e8edf5}.btn:disabled{opacity:.45}
.result{text-align:center}.status{font-size:1.35rem;font-weight:900}.ok{color:var(--g)}.bad{color:var(--x)}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.box{border:1px solid #dfe5ef;border-radius:12px;padding:15px}.box b{display:block;font-size:1.8rem;color:var(--b)}
details{margin-top:20px;text-align:left}.review{border-top:1px solid #eee;padding:12px 0}footer{text-align:center;color:#667085;padding:18px}
@media(max-width:620px){.logo{width:110px}.ctrl{flex-direction:column-reverse}.btn{width:100%}.scores{grid-template-columns:1fr}}
</style>
</head>

const Q=[
["Ao ver a placa de “Área Escolar” (A-33a), o que o motorista deve fazer?",["Reduzir a velocidade e redobrar a atenção com crianças e pedestres.","Seguir na mesma velocidade, já que é uma rua comum.","Buzinar para avisar os pedestres.","Acelerar para passar antes do sinal vermelho."],0],
["Ao virar à direita ou à esquerda, qual atitude básica deve ser tomada?",["Virar em alta velocidade.","Sinalizar a manobra antes de virar.","Parar sobre a faixa de pedestres.","Buzinar e entrar sem olhar."],1],
["Em um cruzamento sem semáforo, você vai virar à esquerda, há pedestres iniciando a travessia na faixa e vem um carro no sentido contrário. O que fazer?",["Virar rápido no espaço entre eles.","Buzinar para todos saírem.","Parar, ceder passagem aos pedestres e aos veículos do sentido contrário, convertendo somente quando for seguro.","Forçar a entrada com farol alto."],2],
["Em cruzamento sem sinalização entre uma rodovia e uma via local, quem tem preferência?",["Quem trafega pela rodovia.","Quem vem mais rápido pela via local.","Quem buzina.","Quem chega primeiro."],0],
["Se o agente de trânsito ordenar que o condutor avance, mas o semáforo estiver vermelho, qual ordem deve ser obedecida?",["Ficar parado por causa do vermelho.","Seguir a ordem do agente, avançando com cuidado.","Buzinar e exigir o verde.","Fazer retorno para evitar a ordem."],1],
["Em um cruzamento de área escolar sem semáforo, com pedestres esperando para atravessar, qual é a conduta correta?",["Acelerar e passar antes.","Parar sobre a faixa para mostrar presença.","Buzinar para liberar a passagem.","Parar e dar preferência de passagem aos pedestres."],3],
["Em um cruzamento não sinalizado, qual é a regra geral de preferência de passagem?",["O maior veículo.","Quem buzina mais.","O veículo que vem pela direita.","Quem chega primeiro e acelerar."],2],
["Em uma estrada de terra, via rural, sem placa de sinalização, conduzir acima de 60 km/h está correto?",["Sim, porque não tem fiscalização.","Não. Em estrada não pavimentada, a velocidade máxima indicada no material é 60 km/h.","Sim, se não houver curva.","Sim, se for de dia."],1],

let n=0,A=Array(Q.length).fill(null);const app=document.getElementById("app"),L=i=>"ABCD"[i];
function show(){let[q,o,c]=Q[n],s=A[n];app.innerHTML='<div class="top"><span>Questão '+(n+1)+' de '+Q.length+'</span><span>'+A.filter(x=>x!==null).length+' respondidas</span></div><div class="bar"><i style="width:'+((n+1)/Q.length*100)+'%"></i></div><div class="q">'+q+'</div><div class="opts">'+o.map((x,i)=>'<button class="opt '+(s===i?'sel':'')+'" data-i="'+i+'"><b>'+L(i)+')</b> '+x+'</button>').join('')+'</div><div class="ctrl"><button class="btn sec" id="p" '+(n===0?'disabled':'')+'>← Anterior</button><button class="btn pri" id="nx" '+(s===null?'disabled':'')+'>'+(n===Q.length-1?'Finalizar prova':'Próxima →')+'</button></div>';
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{A[n]=+b.dataset.i;show()});p.onclick=()=>{if(n>0){n--;show()}};nx.onclick=()=>{if(A[n]===null)return;if(n<Q.length-1){n++;show()}else finish()}}
function finish(){let ac=Q.reduce((t,x,i)=>t+(A[i]===x[2]),0),er=Q.length-ac,pass=ac>=20;app.innerHTML='<div class="result"><h2>Resultado Final</h2><div class="status '+(pass?'ok':'bad')+'">'+(pass?'APROVADO(A) ✅':'REPROVADO(A) ❌')+'</div><div class="scores"><div class="box"><b>'+ac+'</b>Acertos</div><div class="box"><b>'+er+'</b>Erros</div><div class="box"><b>'+Math.round(ac/Q.length*100)+'%</b>Aproveitamento</div></div><p>'+(pass?'Parabéns! Você atingiu o mínimo de 20 acertos.':'Você precisa de pelo menos 20 acertos para aprovação. Continue estudando e tente novamente.')+'</p><button class="btn pri" id="r">Refazer simulado</button></div><details><summary>Ver revisão das respostas</summary>'+Q.map((x,i)=>'<div class="review"><b>'+(i+1)+'. '+x[0]+'</b><p class="'+(A[i]===x[2]?'ok':'bad')+'">'+(A[i]===x[2]?'✓ Correta':'✗ Incorreta')+'</p><p>Sua resposta: '+L(A[i])+' — '+x[1][A[i]]+'</p>'+(A[i]===x[2]?'':'<p>Resposta correta: '+L(x[2])+' — '+x[1][x[2]]+'</p>')+'</div>').join('')+'</details>';r.onclick=()=>{n=0;A=Array(Q.length).fill(null);show();scrollTo(0,0)}}
show();
</script>
